# Ask App Store Connect what state a release is actually in.
#
# The ASC key lives only in this repo's secrets, so a work laptop cannot run
# scripts/asc.py at all. That blindness is not theoretical: a handoff once went
# out guessing that a version might never have been submitted, when it had been
# and was simply queued. Running the same script here, where the key already is,
# puts the answer in a step summary any machine with a browser can read.
#
# Read-only. Every call is a GET; nothing here uploads, submits or mutates.

name: ASC Status

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle id to report on"
        required: false
        default: "ltd.hatcher.transcripts"
  schedule:
    # 14:00 UTC daily, which is a workday morning in ET.
    - cron: "0 14 * * *"

jobs:
  status:
    name: Status
    # ubuntu, not macOS: asc.py needs python3 and openssl and nothing else, and
    # a read-only status check is not worth a macOS runner's minutes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same path convention as testflight.yml, so ASC_KEY_PATH matches what
      # asc.py expects without either file learning a new one.
      - name: Install App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Report
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: ${{ inputs.bundle_id || 'ltd.hatcher.transcripts' }}
        # No `set -e`: one endpoint answering 404 should not hide the three that
        # answered. Each call reports its own failure and the rest carry on.
        run: |
          export ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

          # asc.py writes its HTTP errors to stderr. Merging them into stdout
          # feeds "HTTP 400: ..." to jq, which then reports a JSON parse error
          # and buries the actual cause — so errors go to the log and jq gets
          # an empty object it can handle.
          asc() {
            if ! python3 scripts/asc.py "$1" 2>/tmp/asc.err; then
              echo "  ! query failed: $1" >&2
              sed 's/^/    /' /tmp/asc.err >&2
              echo '{}'
            fi
          }

          APP_ID="$(asc "apps?filter[bundleId]=$BUNDLE_ID&limit=1" | jq -r '.data[0].id // empty')"
          if [ -z "$APP_ID" ]; then
            echo "✗ could not resolve an app id for $BUNDLE_ID" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Sorting happens in jq, not in the query. App Store Connect rejects a
          # `sort=` it does not recognise for that endpoint, and the rejection
          # arrives as a 400 that costs more to diagnose than the sort saves.
          # Unsorted is not an option either: it once answered with eight
          # weeks-old builds and omitted the one just delivered, which reads as
          # "the upload never arrived" — the exact wrong conclusion this
          # workflow exists to prevent.
          {
            echo "## App Store Connect — \`$BUNDLE_ID\` (app $APP_ID)"
            echo

            echo "### Builds (newest first)"
            echo '```'
            asc "apps/$APP_ID/builds?limit=200" \
              | jq -r '[.data[]? | {v:.attributes.version, s:.attributes.processingState, u:.attributes.uploadedDate}]
                       | sort_by(.u // "") | reverse | .[:12][]
                       | "build \(.v)  processing=\(.s // "?")  uploaded=\(.u // "?")"'
            echo '```'
            echo

            # appStoreState is the classic field; appVersionState is what newer
            # API versions answer with. Ask for both so a rename cannot turn a
            # real answer into "?".
            echo "### App Store versions (newest first)"
            echo '```'
            asc "apps/$APP_ID/appStoreVersions?limit=50" \
              | jq -r '[.data[]? | {v:.attributes.versionString,
                                    s:(.attributes.appStoreState // .attributes.appVersionState),
                                    p:.attributes.platform, c:.attributes.createdDate}]
                       | sort_by(.c // "") | reverse | .[:10][]
                       | "\(.v)  state=\(.s // "?")  platform=\(.p // "?")  created=\(.c // "?")"'
            echo '```'
            echo

            # Which TestFlight trains exist at all. An App Store version is a
            # separate object from the builds beneath it, so a train can be full
            # of builds while no App Store version for it has ever been created
            # — and that difference is invisible from the repo.
            echo "### TestFlight trains (pre-release versions)"
            echo '```'
            asc "apps/$APP_ID/preReleaseVersions?limit=50" \
              | jq -r '[.data[]? | {v:.attributes.version, p:.attributes.platform}]
                       | sort_by(.v // "") | reverse | .[:10][]
                       | "\(.v)  platform=\(.p // "?")"'
            echo '```'
            echo

            # The one that answers "was it ever actually submitted?" — as
            # opposed to merely uploaded, which is all the TestFlight workflow
            # does.
            echo "### Review submissions (newest first)"
            echo '```'
            asc "apps/$APP_ID/reviewSubmissions?limit=50" \
              | jq -r '[.data[]? | {s:.attributes.state, p:.attributes.platform, d:.attributes.submittedDate}]
                       | sort_by(.d // "") | reverse | .[:8][]
                       | "state=\(.s // "?")  platform=\(.p // "?")  submitted=\(.d // "-")"'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # A relationship comes back as links only — no `data` key — unless it is
      # explicitly included. Reading relationships.build off the version object
      # therefore reports "no build attached" for every version, attached or
      # not. These have to be fetched by following the related link.
      - name: Diagnose each version
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: ${{ inputs.bundle_id || 'ltd.hatcher.transcripts' }}
        run: |
          export ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          asc() { python3 scripts/asc.py "$1" 2>/dev/null || echo '{}'; }
          APP_ID="$(asc "apps?filter[bundleId]=$BUNDLE_ID&limit=1" | jq -r '.data[0].id // empty')"

          {
            echo
            echo "### Version diagnosis"
            echo '```'
            for VID in $(asc "apps/$APP_ID/appStoreVersions?limit=10" | jq -r '.data[]?.id'); do
              VS="$(asc "appStoreVersions/$VID" | jq -r '.data.attributes.versionString // "?"')"
              ST="$(asc "appStoreVersions/$VID" | jq -r '.data.attributes.appStoreState // .data.attributes.appVersionState // "?"')"
              BUILD="$(asc "appStoreVersions/$VID/build" | jq -r '.data.attributes.version // "*** NO BUILD ATTACHED ***"')"
              SUB="$(asc "appStoreVersions/$VID/appStoreVersionSubmission" | jq -r 'if .data then "present" else "none" end')"
              # appStoreReviewDetail carries demo-account credentials and a
              # contact phone and email. This repo is public, so its Actions
              # logs are too — report only that it exists, never its contents.
              RD="$(asc "appStoreVersions/$VID/appStoreReviewDetail" | jq -r 'if .data then "present (contents redacted)" else "none" end')"
              echo "$VS  state=$ST"
              echo "    build attached : $BUILD"
              echo "    submission     : $SUB"
              echo "    review detail  : $RD"
            done
            echo '```'
            echo

            echo "### Review submission contents"
            echo '```'
            for RID in $(asc "apps/$APP_ID/reviewSubmissions?limit=10" | jq -r '.data[]?.id'); do
              asc "reviewSubmissions/$RID?include=items" \
                | jq -r '"\(.data.attributes.state // "?")  submitted=\(.data.attributes.submittedDate // "-")  items=\([.included[]?.type] | join(","))"'
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # "Is it queued, or is it stuck on something we own?" Everything below is
      # a thing that can hold a submission on the developer's side, and which
      # the top-level states do not distinguish from ordinary waiting.
      - name: Blockers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: ${{ inputs.bundle_id || 'ltd.hatcher.transcripts' }}
        run: |
          export ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          asc() { python3 scripts/asc.py "$1" 2>/dev/null || echo '{}'; }
          APP_ID="$(asc "apps?filter[bundleId]=$BUNDLE_ID&limit=1" | jq -r '.data[0].id // empty')"

          {
            echo
            echo "### Submission items (per-item state)"
            echo '```'
            for RID in $(asc "apps/$APP_ID/reviewSubmissions?limit=10" | jq -r '.data[]?.id'); do
              RS="$(asc "reviewSubmissions/$RID" | jq -r '.data.attributes.state // "?"')"
              echo "submission $RS"
              asc "reviewSubmissions/$RID/items" \
                | jq -r '.data[]? | "    item state=\(.attributes.state // "?")  removed=\(.attributes.removed // "?")"'
            done
            echo '```'
            echo

            echo "### Attached build health"
            echo '```'
            for VID in $(asc "apps/$APP_ID/appStoreVersions?limit=10" | jq -r '.data[]?.id'); do
              BID="$(asc "appStoreVersions/$VID/build" | jq -r '.data.id // empty')"
              [ -z "$BID" ] && { echo "no build attached"; continue; }
              asc "builds/$BID" | jq -r '"build \(.data.attributes.version)  processing=\(.data.attributes.processingState)  expired=\(.data.attributes.expired)  usesNonExemptEncryption=\(.data.attributes.usesNonExemptEncryption)"'
              # A build missing its encryption declaration cannot go to review.
              asc "builds/$BID/appEncryptionDeclaration" \
                | jq -r 'if .data then "    encryption declaration: \(.data.attributes.appEncryptionDeclarationState // "present")" else "    encryption declaration: NONE" end'
            done
            echo '```'
            echo

            echo "### Whats New present for the submitted version"
            echo '```'
            for VID in $(asc "apps/$APP_ID/appStoreVersions?limit=10" | jq -r '.data[]?.id'); do
              asc "appStoreVersions/$VID/appStoreVersionLocalizations?limit=10" \
                | jq -r '.data[]? | "    \(.attributes.locale)  whatsNew=\(if (.attributes.whatsNew // "") == "" then "EMPTY" else "present" end)"'
            done
            echo '```'
            echo

            echo "### App-level"
            echo '```'
            asc "apps/$APP_ID" | jq -r '.data.attributes | "contentRights=\(.contentRightsDeclaration // "?")  locale=\(.primaryLocale // "?")"'

            # Territory is not cosmetic. 1.0.6 was rejected under guideline 5
            # because the app linked CallKit *and* listed China, where MIIT
            # requires CallKit be deactivated — a pairing invisible from the repo,
            # since one half lives in the source and the other in App Store
            # Connect. CHN is called out by name because it is the one that
            # carries rules the code cannot satisfy on its own.
            #
            # Both endpoints, because "0 territories" from a query that failed and
            # "0 territories" from an app available nowhere print identically, and
            # only one of those is a catastrophe. availableTerritories is the
            # classic relationship; appAvailabilityV2 is what newer API versions
            # answer with. If both come back empty the app really is listed
            # nowhere; if one answers, that is the count.
            T1="$(python3 scripts/asc.py "apps/$APP_ID/availableTerritories?limit=200" 2>/dev/null || echo '{}')"
            C1="$(printf '%s' "$T1" | jq -r '[.data[]?] | length')"
            T2="$(python3 scripts/asc.py "appAvailabilityV2/$APP_ID/availableTerritories?limit=200" 2>/dev/null || echo '{}')"
            C2="$(printf '%s' "$T2" | jq -r '[.data[]?] | length')"
            COUNT=$(( C1 > C2 ? C1 : C2 ))
            if printf '%s%s' "$T1" "$T2" | grep -q '"CHN"'; then
              echo "territories=$COUNT  CHINA=LISTED (CallKit must not be active)"
            elif [ "$COUNT" -eq 0 ]; then
              echo "territories=0 from BOTH endpoints — either listed nowhere, or neither endpoint answered. Check Pricing and Availability by hand."
            else
              echo "territories=$COUNT  CHINA=not listed"
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The daily watch. Succeeds while nothing has changed and fails the
      # moment it does, because GitHub emails on failure by default — so a
      # state change reaches an inbox without anyone opening a dashboard, and
      # a queue that is still a queue stays silent.
      #
      # A query that could not answer is NOT a change: it exits 0. An alert
      # that cries wolf every time Apple's API blips is an alert people learn
      # to ignore, which is worse than not having one.
      #
      # WATCH_FOR names the state we are currently parked in, not a state we
      # are hoping for, and it has to be re-pointed whenever the submission
      # genuinely moves. Left at WAITING_FOR_REVIEW after 1.0.6 came back
      # REJECTED on 2026-09-15, every scheduled run would have failed every
      # morning — the same cried-wolf failure this step was written to avoid,
      # only self-inflicted.
      - name: Watch for a state change
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: ${{ inputs.bundle_id || 'ltd.hatcher.transcripts' }}
          WATCH_FOR: REJECTED
        run: |
          export ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          asc() { python3 scripts/asc.py "$1" 2>/dev/null || echo '{}'; }
          APP_ID="$(asc "apps?filter[bundleId]=$BUNDLE_ID&limit=1" | jq -r '.data[0].id // empty')"
          STATE="$(asc "apps/$APP_ID/appStoreVersions?limit=50" \
            | jq -r '[.data[]? | {s:(.attributes.appStoreState // .attributes.appVersionState), c:.attributes.createdDate}]
                     | sort_by(.c // "") | reverse | .[0].s // empty')"

          if [ -z "$STATE" ]; then
            echo "Could not determine the state. Not treating that as a change."
            exit 0
          fi
          echo "newest App Store version state: $STATE"
          if [ "$STATE" = "$WATCH_FOR" ]; then
            echo "Still $WATCH_FOR — nothing to report."
            exit 0
          fi

          echo "::error::App Store state changed: $WATCH_FOR -> $STATE"
          echo "## State changed: \`$STATE\`" >> "$GITHUB_STEP_SUMMARY"
          # Only the scheduled run fails. A manual run should report the state
          # without painting itself red for answering the question correctly.
          [ "${{ github.event_name }}" = "schedule" ] && exit 1
          exit 0

      # The summary flattens each record to one line. When the question is
      # "why is it in that state", the fields it dropped are usually the answer.
      - name: Raw JSON
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: ${{ inputs.bundle_id || 'ltd.hatcher.transcripts' }}
        run: |
          export ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          APP_ID="$(python3 scripts/asc.py "apps?filter[bundleId]=$BUNDLE_ID&limit=1" | jq -r '.data[0].id // empty')"
          for ep in "builds?limit=5" "appStoreVersions?limit=3" "reviewSubmissions?limit=3"; do
            echo "===== $ep ====="
            python3 scripts/asc.py "apps/$APP_ID/$ep" || true
          done
