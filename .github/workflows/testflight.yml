# Build the iOS app and hand it to TestFlight.
#
# Tag-driven: `git tag v1.0.0 && git push --tags` ships that version. The tag is
# the only place the marketing version is written during a release, so the thing
# in App Store Connect and the thing in git history cannot disagree.
#
# The build number is read from App Store Connect — whatever it already holds,
# plus one. Not the run number: builds uploaded from a laptop, or a run that
# fails after uploading, leave gaps a local counter cannot know about, and a
# build number App Store Connect has seen before is rejected on sight.
#
# Nothing here mutates project.yml. MARKETING_VERSION and CURRENT_PROJECT_VERSION
# are passed to xcodebuild as build settings, which override the spec for that
# invocation only — so a failed release leaves no half-stamped file behind.

name: TestFlight

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image (blank = macos-26; xcode-27-arm64 to try the next toolchain)"
        required: false
      version:
        description: "Marketing version, e.g. 1.0.0"
        required: true

concurrency:
  # Never two uploads at once: they would race for the same build number.
  group: testflight
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Unit tests
        run: swift test

  testflight:
    name: Upload to TestFlight
    needs: test
    # Chosen at dispatch time so a newer toolchain can be tried without editing
    # this file. Apple periodically stops accepting App Store builds from the
    # current release Xcode before the next one has an RC — when that happens
    # the only newer toolchain in existence is on the xcode-27 preview image.
    runs-on: ${{ inputs.runner || 'macos-26' }}
    steps:
      - uses: actions/checkout@v4

      # A beta Xcode builds against a beta SDK, which App Store Connect normally
      # refuses — better to fail here than to learn it from a rejection email
      # after the upload. It stops being a hard failure only when a beta runner
      # was asked for on purpose, which is how you test whether Apple has begun
      # accepting the next train before its RC exists.
      - name: Refuse a beta toolchain
        run: |
          xcodebuild -version
          if xcodebuild -version | grep -qi beta; then
            if [ -n "${{ inputs.runner }}" ]; then
              echo "::warning::Beta Xcode, requested deliberately. TestFlight will take it; the App Store may not."
            else
              echo "::error::Beta Xcode cannot produce an App Store build."
              exit 1
            fi
          fi

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # CFBundleShortVersionString must be one to three integers. A
          # pre-release suffix like 1.0.0-beta.1 is valid for the Mac updater
          # and rejected by App Store Connect, so take the numeric core.
          echo "marketing=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
          echo "▶ ${VERSION%%-*}"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # A dedicated keychain rather than the login one: it is unlocked with a
      # password that exists only for this run, and it disappears with the
      # runner. set-key-partition-list is what stops codesign blocking on a UI
      # prompt that no one is there to answer.
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/dist.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      # xcodebuild and altool both look here by convention, so no path flags.
      - name: Install App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8

      # Ask App Store Connect what it already has rather than assuming. The run
      # number was the obvious choice and the wrong one: uploads from a laptop,
      # or a run that fails after uploading, both leave gaps the counter knows
      # nothing about, and a build number App Store Connect has already seen is
      # rejected. Max-known plus one is self-correcting whatever else happened.
      - name: Next build number
        id: build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import base64, json, os, subprocess, time, urllib.request
          kid, iss = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"]
          key = os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{kid}.p8")
          enc = lambda x: base64.urlsafe_b64encode(x).rstrip(b"=")
          now = int(time.time())
          signing = (enc(json.dumps({"alg":"ES256","kid":kid,"typ":"JWT"},separators=(",",":")).encode())
                     + b"." + enc(json.dumps({"iss":iss,"iat":now,"exp":now+900,
                                              "aud":"appstoreconnect-v1"},separators=(",",":")).encode()))
          der = subprocess.run(["openssl","dgst","-sha256","-sign",key],
                               input=signing, capture_output=True).stdout
          # ES256 wants raw r||s; openssl emits DER SEQUENCE{INTEGER r, INTEGER s}.
          i = 2 + ((der[1] & 0x7f) if der[1] & 0x80 else 0)
          def read_int(buf, off):
              ln = buf[off+1]
              return buf[off+2:off+2+ln].lstrip(b"\x00").rjust(32, b"\x00"), off+2+ln
          r, off = read_int(der, i)
          s, _ = read_int(der, off)
          token = (signing + b"." + enc(r + s)).decode()
          url = "https://api.appstoreconnect.apple.com/v1/builds?filter[app]=6802331047&limit=200"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
          builds = json.load(urllib.request.urlopen(req)).get("data", [])
          seen = [int(b["attributes"]["version"]) for b in builds
                  if str(b["attributes"].get("version", "")).isdigit()]
          print(f"number={max(seen) + 1 if seen else 1}")
          PY
          echo "▶ build ${{ steps.build.outputs.number }}"

      - name: Archive
        run: |
          xcodebuild archive \
            -project Transcripts.xcodeproj \
            -scheme Transcripts \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Transcripts.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.TEAM_ID }} \
            MARKETING_VERSION=${{ steps.version.outputs.marketing }} \
            CURRENT_PROJECT_VERSION=${{ steps.build.outputs.number }}

      - name: Export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

      # PATH is deliberate. exportArchive shells out to /usr/bin/rsync, which on
      # macOS 26 is openrsync; if a Homebrew rsync is earlier in PATH, openrsync
      # spawns it as its helper and dies on "--extended-attributes: unknown
      # option", surfacing as a bare "Copy failed".
      - name: Export IPA
        run: |
          PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH" xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Transcripts.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      # Unpack once, here, and let the assertions below share it. They used to
      # unpack independently into the same directory, so the second one met a
      # populated directory, unzip prompted to overwrite, found no stdin, and
      # exited non-zero — failing the step before its actual check ever ran.
      - name: Unpack the IPA
        run: |
          rm -rf "$RUNNER_TEMP/unpacked"
          unzip -q "$RUNNER_TEMP/export/Transcripts.ipa" -d "$RUNNER_TEMP/unpacked"
          echo "APP=$RUNNER_TEMP/unpacked/Payload/Transcripts.app" >> "$GITHUB_ENV"

      # The privacy answer and the review notes both tell Apple this binary
      # contains no networking code and invite them to check. Check it here, so
      # the claim cannot quietly stop being true between releases.
      - name: Assert the no-networking claim
        run: |
          if nm -u "$APP/Transcripts" | grep -E 'URLSession|URLRequest|NWConnection'; then
            echo "::error::Networking symbols are present, but the App Store privacy answer says they are not."
            exit 1
          fi
          echo "✓ no networking symbols"

      # ITMS-90626, Invalid Siri Support: App Store processing rejects an intent
      # description naming another platform, and it does so *after* upload —
      # --validate-app passes the binary, then the build is silently discarded
      # and never appears in App Store Connect. That cost an afternoon on
      # 2026-08-17, twice, so check the compiled metadata here where it is cheap.
      - name: Assert no platform names in Siri metadata
        run: |
          python3 - "$APP/Metadata.appintents/extract.actionsdata" <<'PY'
          import json, re, sys, pathlib

          src = pathlib.Path(sys.argv[1])
          if not src.exists():
              print("no App Intents metadata in this build — nothing to check")
              sys.exit(0)
          data = json.loads(src.read_text())

          # Only the strings Apple actually shows to Siri. Grepping the whole
          # Metadata.appintents directory was the first attempt and is wrong:
          # it walks binary NLU blobs, where a three-letter substring like
          # "mac" hits by chance and fails the build for nothing.
          strings = []
          def walk(node):
              if isinstance(node, dict):
                  for key, value in node.items():
                      if key == "key" and isinstance(value, str):
                          strings.append(value)
                      else:
                          walk(value)
              elif isinstance(node, list):
                  for item in node:
                      walk(item)
          walk(data)

          banned = re.compile(r"\b(mac|macos|iphone|ipad|apple watch|watchos)\b", re.I)
          hits = [s for s in strings if banned.search(s)]
          if hits:
              for hit in hits:
                  print(f"  names a platform: {hit}")
              print("::error::App Intents metadata names a platform. App Store "
                    "processing rejects this as ITMS-90626 — after the upload "
                    "reports success, so nothing surfaces until the build "
                    "silently fails to appear.")
              sys.exit(1)
          print(f"✓ {len(strings)} Siri-facing strings, none naming a platform")
          PY

      - name: Validate
        run: |
          xcrun altool --validate-app -f "$RUNNER_TEMP/export/Transcripts.ipa" -t ios \
            --apiKey ${{ secrets.ASC_KEY_ID }} --apiIssuer ${{ secrets.ASC_ISSUER_ID }}

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/Transcripts.ipa" -t ios \
            --apiKey ${{ secrets.ASC_KEY_ID }} --apiIssuer ${{ secrets.ASC_ISSUER_ID }}

      - name: Keep the IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Transcripts-${{ steps.version.outputs.marketing }}-${{ steps.build.outputs.number }}
          path: ${{ runner.temp }}/export/Transcripts.ipa
          if-no-files-found: warn
