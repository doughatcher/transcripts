# Dependency updates start here, not downstream.
#
# Package.resolved is tracked so every build — CI, release, and the Blue Acorn
# composition, which takes this file verbatim — runs the same pins. Untracked,
# each CI run resolved whatever was newest inside Package.swift's ranges, so a
# release could silently ship a dependency nobody had run. FluidAudio 0.17
# is the example: it looks for its diarizer models in a different directory,
# so a machine with pre-staged models and no route to Hugging Face loses
# diarization outright.
version: 2
updates:
  - package-ecosystem: swift
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
