# Build the iOS app and hand it to TestFlight.
#
# Tag-driven: `git tag v1.0.0 && git push --tags` ships that version. The tag is
# the only place the marketing version is written during a release, so the thing
# in App Store Connect and the thing in git history cannot disagree.
#
# The build number is the workflow run number, which is monotonic per repository
# and never reused. App Store Connect rejects a build number it has already seen
# for a version, and "bump the number by hand" is the step everyone forgets.
#
# Nothing here mutates project.yml. MARKETING_VERSION and CURRENT_PROJECT_VERSION
# are passed to xcodebuild as build settings, which override the spec for that
# invocation only — so a failed release leaves no half-stamped file behind.

name: TestFlight

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version, e.g. 1.0.0"
        required: true

concurrency:
  # Never two uploads at once: they would race for the same build number.
  group: testflight
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Unit tests
        run: swift test

  testflight:
    name: Upload to TestFlight
    needs: test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # A beta Xcode builds against a beta SDK, and App Store Connect refuses
      # those outright. Better to fail here, before signing, than to find out
      # from a rejection email after the upload.
      - name: Refuse a beta toolchain
        run: |
          xcodebuild -version
          if xcodebuild -version | grep -qi beta; then
            echo "::error::Beta Xcode cannot produce an App Store build."
            exit 1
          fi

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # CFBundleShortVersionString must be one to three integers. A
          # pre-release suffix like 1.0.0-beta.1 is valid for the Mac updater
          # and rejected by App Store Connect, so take the numeric core.
          echo "marketing=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
          echo "▶ ${VERSION%%-*} (build ${{ github.run_number }})"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # A dedicated keychain rather than the login one: it is unlocked with a
      # password that exists only for this run, and it disappears with the
      # runner. set-key-partition-list is what stops codesign blocking on a UI
      # prompt that no one is there to answer.
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/dist.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

      # xcodebuild and altool both look here by convention, so no path flags.
      - name: Install App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Archive
        run: |
          xcodebuild archive \
            -project Transcripts.xcodeproj \
            -scheme Transcripts \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Transcripts.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.TEAM_ID }} \
            MARKETING_VERSION=${{ steps.version.outputs.marketing }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

      # PATH is deliberate. exportArchive shells out to /usr/bin/rsync, which on
      # macOS 26 is openrsync; if a Homebrew rsync is earlier in PATH, openrsync
      # spawns it as its helper and dies on "--extended-attributes: unknown
      # option", surfacing as a bare "Copy failed".
      - name: Export IPA
        run: |
          PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH" xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Transcripts.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      # The privacy answer and the review notes both tell Apple this binary
      # contains no networking code and invite them to check. Check it here, so
      # the claim cannot quietly stop being true between releases.
      - name: Assert the no-networking claim
        run: |
          APP="$RUNNER_TEMP/export/Payload/Transcripts.app"
          [ -d "$APP" ] || APP=$(find "$RUNNER_TEMP/export" -name 'Transcripts.app' -maxdepth 3 | head -1)
          if [ -z "$APP" ]; then
            unzip -q "$RUNNER_TEMP/export/Transcripts.ipa" -d "$RUNNER_TEMP/unpacked"
            APP="$RUNNER_TEMP/unpacked/Payload/Transcripts.app"
          fi
          if nm -u "$APP/Transcripts" | grep -E 'URLSession|URLRequest|NWConnection'; then
            echo "::error::Networking symbols are present, but the App Store privacy answer says they are not."
            exit 1
          fi
          echo "✓ no networking symbols"

      # ITMS-90626, Invalid Siri Support: App Store processing rejects an intent
      # description naming another platform, and it does so *after* upload —
      # --validate-app passes the binary, then the build is silently discarded
      # and never appears in App Store Connect. That cost an afternoon on
      # 2026-08-17, twice, so check the compiled metadata here where it is cheap.
      - name: Assert no platform names in Siri metadata
        run: |
          APP="$RUNNER_TEMP/export/Payload/Transcripts.app"
          [ -d "$APP" ] || { unzip -q "$RUNNER_TEMP/export/Transcripts.ipa" -d "$RUNNER_TEMP/unpacked"; APP="$RUNNER_TEMP/unpacked/Payload/Transcripts.app"; }
          if [ -d "$APP/Metadata.appintents" ] && \
             grep -rioE 'mac|iphone|ipad|apple watch' "$APP/Metadata.appintents"; then
            echo "::error::App Intents metadata names a platform. App Store processing rejects this as ITMS-90626, after a successful upload."
            exit 1
          fi
          echo "✓ no platform names in App Intents metadata"

      - name: Validate
        run: |
          xcrun altool --validate-app -f "$RUNNER_TEMP/export/Transcripts.ipa" -t ios \
            --apiKey ${{ secrets.ASC_KEY_ID }} --apiIssuer ${{ secrets.ASC_ISSUER_ID }}

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/Transcripts.ipa" -t ios \
            --apiKey ${{ secrets.ASC_KEY_ID }} --apiIssuer ${{ secrets.ASC_ISSUER_ID }}

      - name: Keep the IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Transcripts-${{ steps.version.outputs.marketing }}-${{ github.run_number }}
          path: ${{ runner.temp }}/export/Transcripts.ipa
          if-no-files-found: warn
