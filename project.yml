# XcodeGen spec. Regenerate with `just project` after editing.
#
# TranscriptsCore is compiled straight into the app target — the shared surface
# is six files and this app has zero SPM dependencies, so a package indirection
# would be ceremony. TranscriptsActivity is compiled into both the app and the
# widget extension: ActivityKit matches the attributes type across the two
# processes, so one shared definition.
name: Transcripts
packages:
  Transcripts:


















    path: .

options:
  bundleIdPrefix: ltd.hatcher
  deploymentTarget:


















    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Transcripts:


















    type: application
    platform: iOS
    sources:
      - path: Sources/Transcripts
      # The Mac pipeline is excluded rather than compiled and left unused. It is
      # dead code on iOS — the phone's chat chain is FoundationModels then the
      # extractive fallback, never Ollama — but compiling it linked URLSession
      # and URLRequest into the shipped binary. The App Store privacy answer and
      # the review notes both claim those symbols are absent and invite Apple to
      # verify it against the binary, so leaving them in made a checkable claim
      # false. Excluded here, not #if'd, so the Mac package still builds it.
      - path: Sources/TranscriptsCore
        excludes:
          - "Providers/OllamaClient.swift"     # the only URLSession in the app
          - "Providers/CommandRunner.swift"    # Process — unavailable on iOS
          - "Providers/TemplateEngine.swift"   # PipelineEngine only
          - "Providers/ExternalStageResult.swift"
          # PipelineStage.swift and PipelineContext.swift stay: StageID is the
          # config file's stage vocabulary, which AppConfig decodes on iOS too.
          - "Pipeline/PipelineEngine.swift"    # drives external commands
          - "Stages/**"                        # Summarize/Classify build OllamaClient
      - path: Sources/TranscriptsActivity
    dependencies:
      - target: TranscriptsWidgets
        embed: true
    # A generated plist file, NOT GENERATE_INFOPLIST_FILE + INFOPLIST_KEY_*.
    # Those settings only cover a fixed list of scalar keys: UIBackgroundModes is
    # an array and was silently dropped, so the app had no background audio at
    # all. iOS then suspended it on backgrounding, which killed the audio session
    # mid-recording and left the m4a unfinalized (2026-08-10, in the ancestor
    # codebase).
    info:
      path: Sources/Transcripts/Info.plist
      properties:
        CFBundleDisplayName: Transcripts
        # A manually-specified info plist does NOT inherit MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION the way GENERATE_INFOPLIST_FILE would — the
        # keys silently default to 1.0/1, which is the version App Store Connect
        # validates uploads against. Thread the build settings through by hand.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The entire point of a pocket recorder: capture survives the screen
        # locking and the user switching apps. An Info.plist key, not a
        # paid-membership entitlement, so it works under free provisioning.
        UIBackgroundModes: [audio]
        # Lets the recorder show a Dynamic Island / Lock Screen activity, the
        # only signal capture is still alive once the app backgrounds.
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: Transcripts records meetings and voice notes from your microphone.
        # Live text is transcribed on-device only; audio is never sent to a server.
        NSSpeechRecognitionUsageDescription: Transcripts transcribes your recording on this device as you speak, so you can read it live.
        # Only HTTPS via system frameworks — skips the export-compliance
        # questionnaire on every App Store build upload.
        ITSAppUsesNonExemptEncryption: false
        # Puts Transcripts in the share sheet for audio, and lets Files "Open
        # with" hand a recording over. A share extension would do the same at
        # the cost of a second bundle id and an App Group to reach the
        # destination bookmark — this needs neither.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            LSHandlerRank: Alternate
            CFBundleTypeRole: Editor
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - public.mpeg-4-audio
              - com.apple.m4a-audio
              - public.aiff-audio
              - com.microsoft.waveform-audio
        # Opens the file where it sits rather than only a copy, so a recording
        # can be imported without first being duplicated into the app.
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ltd.hatcher.transcripts
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "1"
        # Free provisioning re-signs weekly; leaving the team unset lets Xcode
        # pick the personal one without baking an ID into the repo.
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"

  # WidgetKit extension hosting the Live Activity.
  TranscriptsWidgets:


















    type: app-extension
    platform: iOS
    sources:
      - path: Sources/TranscriptsWidgets
      - path: Sources/TranscriptsActivity
    # A widget extension needs a nested NSExtension dictionary, which the
    # INFOPLIST_KEY_* build settings cannot express — installd rejects the appex
    # outright without it.
    info:
      path: Sources/TranscriptsWidgets/Info.plist
      properties:
        CFBundleDisplayName: Transcripts
        # Must match the host app's versions or the archive fails validation.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ltd.hatcher.transcripts.widgets
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  # The macOS menu-bar app. An Xcode target rather than a SwiftPM executable:
  # SwiftPM cannot emit an .app bundle, and — more sharply — a package and a
  # generated .xcodeproj sharing a directory both offer a "Transcripts" scheme,
  # where xcodebuild silently resolves the project. Building the Mac app then
  # built the iOS one instead. One project, distinct scheme names, no ambiguity.
  TranscriptsMac:


















    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/TranscriptsMac
        excludes: ["Support/Info.plist", "Support/*.entitlements"]
      - path: Sources/TranscriptsMac/Support/Transcripts.icns
        buildPhase: resources
    dependencies:
      - package: Transcripts
        product: TranscriptsCore
      - package: Transcripts
        product: TranscriptsEngine
    # Every key must be declared here. `info.path` GENERATES the plist rather
    # than copying an existing one, so the hand-ported file that used to live at
    # that path was silently overwritten — taking LSUIElement, both TCC usage
    # strings and the icon with it. Nothing failed loudly: the app still built,
    # still launched, and still recorded, it just grew a Dock icon and lost the
    # sentences macOS shows when asking for the microphone.
    info:
      path: Sources/TranscriptsMac/Support/Info.plist
      properties:
        CFBundleDisplayName: Transcripts
        CFBundleName: Transcripts
        # An agent app: menu bar only, no Dock icon, no menu bar of its own.
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        CFBundleIconFile: Transcripts
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: Transcripts records meetings and voice notes from your microphone.
        NSSpeechRecognitionUsageDescription: Transcripts transcribes your recordings on this device to create readable transcripts.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ltd.hatcher.transcripts
        PRODUCT_NAME: Transcripts
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "1"
        # Unsandboxed by necessity: ScreenCaptureKit system audio and an
        # arbitrary user-chosen vault path. Signed without entitlements — a
        # self-signed build carrying sandbox entitlements is a known way to end
        # up "authorized" by TCC but fed silence.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Transcripts Local Signing"
        CODE_SIGN_ENTITLEMENTS: ""
