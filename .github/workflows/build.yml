# Compile the iOS app on every branch and pull request.
#
# The only thing that built the app before a release was the TestFlight
# workflow, and that one signs, archives and uploads — far too much machinery to
# ask "does this compile?", and impossible to run from a machine that is not a
# Mac. This is the cheap half: xcodegen, a simulator build with signing off, and
# the Core suite. It needs no secrets, so it also runs on forks.
#
# main is deliberately included. A release dispatch builds whatever main holds
# at that moment, and finding out then that it does not compile is finding out
# in the worst place.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # Its own group, not the release or testflight ones — a superseded branch push
  # should be cancelled, and neither of those may ever be.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Xcode
        run: xcodebuild -version

      - name: Unit tests
        run: swift test

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # The simulator destination is what makes this signing-free: a device
      # build wants a provisioning profile and with it the whole certificate
      # dance the TestFlight workflow exists to do.
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Transcripts.xcodeproj \
            -scheme Transcripts \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # The Mac app had no compile check anywhere. `swift test` covers
      # TranscriptsCore and TranscriptsEngine, and the step above covers iOS —
      # but everything under Sources/TranscriptsMac was only ever verified by
      # someone running `just reload` on their own machine. When Xcode 27 landed
      # and the license agreement on file was still 26.5, that stopped being
      # possible and the Mac target had no verification path at all: not local,
      # not here.
      #
      # Signing is off for the same reason as the simulator step. This proves it
      # compiles, which is the gap; release.yml still owns proving it ships.
      - name: Build the Mac app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Transcripts.xcodeproj \
            -scheme TranscriptsMac \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  # Tell the Blue Acorn composition (BlueAcornInc/scribe) that main moved, once
  # main is known to build. Its watch-upstream workflow composes the new commit
  # and opens a reviewed PR there; nothing merges on its own. Without this the
  # only signal Scribe got was a weekly poll, so a fix made here could sit
  # unshipped downstream for days.
  #
  # Needs DOWNSTREAM_DISPATCH_TOKEN: a fine-grained PAT scoped to
  # BlueAcornInc/scribe with Contents: read and write. Without it this warns
  # and passes, because a missing downstream must never turn upstream red.
  notify-scribe:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch upstream-push to Scribe
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No DOWNSTREAM_DISPATCH_TOKEN — Scribe was not told about $SHA."
            exit 0
          fi
          gh api repos/BlueAcornInc/scribe/dispatches \
            -f event_type=upstream-push \
            -f "client_payload[sha]=$SHA" \
            -f "client_payload[ref]=main"
